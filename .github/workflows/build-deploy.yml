name: CI / CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# A newer run for the same branch/PR cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_HOSTNAME: localhost
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: social_feed
      SECRET_KEY: ci-secret-not-used-anywhere-real
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: social_feed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check formatting (black)
        run: black --check backend

      - name: Type check (mypy --strict)
        # --strict on the application package only. The tests deliberately poke
        # at private state and monkeypatch bcrypt; annotating that to the same
        # standard would buy nothing.
        run: mypy --config-file backend/mypy.ini --strict backend/app

      - name: Audit dependencies (pip-audit)
        # Runtime and dev both: a vulnerable test client is still something CI
        # installs and runs.
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-dev.txt

      - name: Create the test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c "CREATE DATABASE social_feed_test;"

      - name: Migrations apply cleanly on an empty database
        run: alembic -c backend/alembic.ini upgrade head

      - name: Migrations match the models
        # Catches the drift that bites later: a column added to models.py with
        # no migration behind it. The tests build their schema with
        # create_all(), so without this nothing would notice until deploy.
        run: alembic -c backend/alembic.ini check

      - name: Run tests
        working-directory: backend
        run: pytest -q

      - name: The committed OpenAPI spec is up to date
        # docs/openapi.json is what the demo links to as "the contract it
        # implements", and this API has no deployment to serve a live one from.
        # A route added without re-exporting would leave that link describing
        # last week's API, which is worse than not linking anything.
        run: python backend/scripts/export_openapi.py --check

      - name: Coverage badge is up to date
        # The badge is a committed SVG, not a third-party service. If coverage
        # moved and nobody re-rendered it, fail here rather than let the README
        # advertise a stale number.
        run: python backend/scripts/coverage_badge.py --check

      - name: Repo measurements are up to date
        # frontend/stats.json is what the colophon at #/colophon prints, and a
        # page about craft whose figures describe last month is worse than a
        # page with no figures. This job can take the pytest count; the
        # frontend job below takes the Playwright one, and the script says
        # which measurements it managed. Between the two, every number is
        # checked by somebody.
        run: python docs/stats.py --check

  frontend:
    name: frontend (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # From the file rather than inline, so the version CI installs and the
          # version a `nvm use` picks up locally cannot drift apart. They had:
          # the lockfile was written by npm 11 (Node 24) and `npm ci` on npm 10
          # (Node 22) refused it. See docs/adr/0006-lighthouse-without-lhci.md.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          # mock_api.py is stdlib-only, but the suite still needs an interpreter
          # to run it and to serve the static files.
          python-version: "3.14"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check (tsc --noEmit)
        # JSDoc types with checkJs — no build step, nothing emitted. See
        # docs/adr/0001-vanilla-js-with-jsdoc-types.md.
        working-directory: frontend
        run: npm run typecheck

      - name: Check formatting (prettier)
        # The frontend half of the `black --check` in the backend job. Same
        # arrangement deliberately: the formatter is a gate, not a commit hook
        # that rewrites somebody's work while they are looking at it.
        working-directory: frontend
        run: npm run format:check

      - name: Repo measurements are up to date
        # The other half of the check in the backend job: this one has the
        # Playwright install and so can count the end-to-end tests, and has no
        # pytest and so skips the API count. No working-directory — the script
        # measures the repository, not the frontend.
        run: python docs/stats.py --check

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        # --ignore-snapshots covers exactly one file. tests/visual.spec.js
        # compares screenshots, and Playwright names each baseline after the
        # platform that recorded it, because macOS and Linux rasterise type
        # differently enough that a shared baseline is not a strict test but a
        # permanently failing one. So the visual specs still *run* here — every
        # navigation, every control, every evaluate, so a screen that throws
        # still turns this red — and only the pixel comparison is skipped, on a
        # runner that has no baseline it could honestly compare against. The
        # comparison is real where the design work happens: `npm run
        # test:visual`. See the note at the top of that file.
        working-directory: frontend
        run: npm test -- --ignore-snapshots

      - name: Lighthouse
        # Against the demo build, which is what the published site serves. The
        # floors in tests/lighthouse.mjs are there to catch a regression — a
        # render-blocking script that crept in, a label that went missing — not
        # a score to chase. Runs after the Playwright install above, because it
        # drives that same pinned Chromium.
        working-directory: frontend
        run: npm run lighthouse

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: frontend/tests/.lighthouse
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/tests/.report
          retention-days: 7

  build-and-push:
    needs: [test, frontend]
    # Only publish an image from the real thing: a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
