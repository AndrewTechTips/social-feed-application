name: Pages

# Publishes frontend/ to GitHub Pages.
#
# There is no build step — the app is hand-written HTML, CSS and ES modules, so
# what gets uploaded is what's in the repo. On a static host the app answers its
# own API calls from js/demo/backend.js; see js/config.js for how it decides.
#
# `enablement: true` below means this no longer has to be switched on by hand.
# It was, and the failure mode was confusing: with the source left on "Deploy
# from a branch", GitHub's own legacy Jekyll builder keeps running and publishes
# a rendered README at the same URL, so the site looks live while this workflow
# fails every time at configure-pages with "Get Pages site failed ... Not
# Found". A green padlock on a page nobody meant to publish.
#
# With enablement on, this workflow sets the source to GitHub Actions itself,
# which also stops the legacy builder from running.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  # so the site can be republished without a frontend change
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Unlike the CI workflow this doesn't cancel what's
# already running: a half-finished deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        with:
          # Enable Pages and point it at this workflow if it isn't already.
          # Needs the `pages: write` permission above, which is here for the
          # deploy step anyway.
          enablement: true

      # The update beacon's one moving part.
      #
      # js/update.js reads this file when the tab becomes visible and compares
      # the sha against the one the document booted under; a difference is a
      # deploy that happened while somebody had the app open, and is what puts
      # the "a new version is ready" band on their screen. There is no build
      # step to fingerprint the app's files (ADR 0001), so this one generated
      # line is what stands in for the whole of that — and it is generated
      # *here*, at deploy time, rather than committed, because a sha in the
      # repository would be a sha of the commit before the one being deployed.
      #
      # Written into the artifact rather than the checkout: nothing about the
      # working tree should change because a deploy ran. It is deliberately not
      # in sw.js's SHELL and is never cached — see the fetch handler there.
      - name: Stamp the deployed version
        run: |
          printf '{\n  "sha": "%s",\n  "built": "%s"\n}\n' \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > frontend/version.json
          cat frontend/version.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend

      - id: deploy
        uses: actions/deploy-pages@v5
