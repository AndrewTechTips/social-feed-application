[pytest]
# Run from this directory:  cd backend && pytest
# (pytest puts the repo root on sys.path via the backend/ + tests/ __init__.py chain,
#  so `from backend.app import ...` resolves without setting PYTHONPATH.)

# Coverage is on by default rather than behind a flag, so the number in the
# README is the number you get locally. --cov-fail-under is the gate: CI goes
# red below it, which is the only thing that stops coverage quietly rotting.
addopts =
    --cov=backend.app
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85

filterwarnings =
    error
    # slowapi 0.1.10 calls asyncio.iscoroutinefunction internally; it is not our
    # code and no newer release fixes it. Remove this line once slowapi updates.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
    # anyio 4.15 turned anyio.abc.BlockingPortal into a deprecated alias, and
    # starlette's test client still reaches for it — three times in
    # starlette/testclient.py, at import. It fires before a single test runs,
    # so the whole suite fails to collect.
    #
    # Neither half is ours and neither can be upgraded out of: 1.6.0 is the
    # newest starlette and still uses the alias. The other way out is pinning
    # anyio below 4.15, and that is the wrong trade — anyio is a *runtime*
    # dependency of the served app, so holding it back would mean no anyio
    # security fixes in production to silence a message that only appears when
    # a test imports the test client.
    #
    # Nothing in this repo touches anyio directly (starlette is the only thing
    # that does), and the match is one exact message, so `error` above still
    # catches every other anyio deprecation. Remove this line once starlette
    # moves to anyio.from_thread.BlockingPortal.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
