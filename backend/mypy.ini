# Type checking for the API, run from the repo root:
#
#     mypy --strict backend/app
#
# --strict is the whole point. A half-checked codebase gives you the cost of
# annotations without the guarantee, and the guarantee is what makes them worth
# writing.
[mypy]
python_version = 3.14
# Reads the Field(...) definitions on BaseSettings, so `Settings()` with every
# value coming from the environment isn't reported as five missing arguments.
plugins = pydantic.mypy

[mypy-slowapi.*]
# slowapi 0.1.10 ships no type information and has no stubs on typeshed.
ignore_missing_imports = True
