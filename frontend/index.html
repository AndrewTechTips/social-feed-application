<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Set the theme before first paint so there's no flash. The rest of the
    // app is ES modules (deferred); this one inline line has to run early.
    try {
      var t = localStorage.getItem('commons.theme');
      document.documentElement.dataset.theme =
        t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Commons</title>
  <meta name="description" content="A small public common. Anyone can read; you need a key to write." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0c1315" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef1f1" media="(prefers-color-scheme: light)" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23e7edec' stroke-width='1.7'/%3E%3Ccircle cx='12' cy='10' r='2.7' fill='%23f0a63c'/%3E%3Cpath d='M10.7 11.7 L9.6 16.2 A0.6 0.6 0 0 0 10.2 17 h3.6 a0.6 0.6 0 0 0 0.6-.8 L13.3 11.7 Z' fill='%23f0a63c'/%3E%3C/svg%3E" />
  <link rel="preload" href="./assets/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/views.css" />

  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="aurora-bloom aurora-bloom--warm"></span>
    <span class="aurora-bloom aurora-bloom--cool"></span>
  </div>

  <header class="site-header" data-glass>
    <div class="site-header__inner">
      <a class="brand" href="#/" aria-label="Commons — home">
        <svg class="brand__mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="10" r="2.6" fill="currentColor" />
          <path d="M10.7 11.6 L9.6 16.2 A0.6 0.6 0 0 0 10.2 17 h3.6 a0.6 0.6 0 0 0 0.6-.8 L13.3 11.6 Z" fill="currentColor" />
        </svg>
        <span class="brand__word">Commons</span>
      </a>

      <form class="search" role="search" hidden>
        <label class="visually-hidden" for="search-input">Search the feed</label>
        <svg class="search__icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false">
          <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7" />
          <line x1="13.5" y1="13.5" x2="18" y2="18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <!-- maxlength matches the max_length on the API's search parameter; without
             it a longer query is a 422 the feed renders as "didn't load". -->
        <input id="search-input" class="search__input" type="search" name="search"
               placeholder="Search titles" autocomplete="off" enterkeyhint="search"
               maxlength="100" />
      </form>

      <div class="account" id="account"><!-- rendered by main.js --></div>
    </div>
  </header>

  <main id="view" tabindex="-1"><!-- rendered by the router --></main>

  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <template id="tpl-skeleton-card">
    <article class="card card--skeleton" aria-hidden="true">
      <div class="card__rail"><span class="sk sk--caret"></span><span class="sk sk--count"></span></div>
      <div class="card__body">
        <span class="sk sk--title"></span>
        <span class="sk sk--line"></span>
        <span class="sk sk--line sk--short"></span>
        <span class="sk sk--meta"></span>
      </div>
    </article>
  </template>
</body>
</html>
