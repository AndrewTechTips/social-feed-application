<!doctype html>
<html lang="en">
  <head>
    <script>
      // Set the theme before first paint so there's no flash. The rest of the
      // app is ES modules (deferred); this one inline line has to run early.
      try {
        var t = localStorage.getItem("commons.theme");
        document.documentElement.dataset.theme =
          t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        // Same reasoning for the reading size: a post that arrives at one size
        // and resets to another a frame later is worse than not offering the
        // choice. js/reading.js owns the key; this only has to be early.
        var s = localStorage.getItem("commons.textsize");
        document.documentElement.dataset.textSize = s === "s" || s === "l" ? s : "m";
        // And the measure, for the same reason: a column that reflows one frame
        // after it paints is the same broken promise a resizing font is.
        var w = localStorage.getItem("commons.measure");
        document.documentElement.dataset.measure = w === "narrow" ? w : "normal";
        // And the motion override, for the same reason as the three above:
        // the aurora and the page's entrance animations start at the first
        // frame, and a reader who asked for less motion should not get one
        // frame of it while a module loads.
        if (localStorage.getItem("commons.motion") === "reduce") {
          document.documentElement.dataset.motion = "reduce";
        }
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.textSize = "m";
        document.documentElement.dataset.measure = "normal";
      }
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Commons</title>
    <meta
      name="description"
      content="A small public common. Anyone can read; you need a key to write."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c1315" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1f1" media="(prefers-color-scheme: light)" />

    <!-- Icons. The SVG is first so a browser that can take one gets the sharp
       version at every size; the PNGs are the fallback, and favicon.ico is
       there for the crawlers that ask for /favicon.ico by convention and never
       read these tags at all. All of them are generated from the same brand
       mark by docs/make_icons.mjs. -->
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="./assets/icons/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="./assets/icons/favicon-16.png"
      sizes="16x16"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- One address for this page, whatever brought somebody to it.
       The app is hash-routed, so every screen shares this document — and a
       crawler that arrives at `?demo=1`, or with a campaign parameter stuck on
       the end by whatever pasted the link, would otherwise be looking at what
       it has to treat as a separate URL with identical content. Absolute,
       because that is what a canonical link is for. -->
    <link
      rel="canonical"
      href="https://andrewtechtips.github.io/social-feed-application/"
    />

    <!-- Link previews. og:image has to be absolute — a crawler resolving it has
       no page context to resolve a relative path against. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commons" />
    <meta property="og:title" content="Commons — a small public common" />
    <meta
      property="og:description"
      content="A hand-written feed on a FastAPI backend. No framework, no build step. The live demo runs entirely in your browser."
    />
    <meta
      property="og:url"
      content="https://andrewtechtips.github.io/social-feed-application/"
    />
    <meta
      property="og:image"
      content="https://andrewtechtips.github.io/social-feed-application/assets/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Commons — a small public common" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commons — a small public common" />
    <meta
      name="twitter:description"
      content="A hand-written feed on a FastAPI backend. No framework, no build step."
    />
    <meta
      name="twitter:image"
      content="https://andrewtechtips.github.io/social-feed-application/assets/og.png"
    />
    <link
      rel="preload"
      href="./assets/fonts/newsreader.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/chrome.css" />
    <link rel="stylesheet" href="./styles/views.css" />
    <!-- media="print" so it never blocks a render and costs nothing to anybody
       who isn't printing. It redefines the colour tokens rather than chasing
       rules; see the note at the top of the file. -->
    <link rel="stylesheet" href="./styles/print.css" media="print" />

    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="aurora-bloom aurora-bloom--warm"></span>
      <span class="aurora-bloom aurora-bloom--cool"></span>
    </div>

    <header class="site-header" data-glass>
      <div class="site-header__inner">
        <a class="brand" href="#/" aria-label="Commons — home">
          <svg
            class="brand__mark"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              cx="12"
              cy="12"
              r="9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <circle cx="12" cy="10" r="2.6" fill="currentColor" />
            <path
              d="M10.7 11.6 L9.6 16.2 A0.6 0.6 0 0 0 10.2 17 h3.6 a0.6 0.6 0 0 0 0.6-.8 L13.3 11.6 Z"
              fill="currentColor"
            />
          </svg>
          <span class="brand__word">Commons</span>
        </a>

        <form class="search" role="search" hidden>
          <label class="visually-hidden" for="search-input">Search the feed</label>
          <svg
            class="search__icon"
            viewBox="0 0 20 20"
            width="16"
            height="16"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              cx="9"
              cy="9"
              r="6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />
            <line
              x1="13.5"
              y1="13.5"
              x2="18"
              y2="18"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
          <!-- maxlength matches the max_length on the API's search parameter; without
             it a longer query is a 422 the feed renders as "didn't load". -->
          <input
            id="search-input"
            class="search__input"
            type="search"
            name="search"
            placeholder="Search titles"
            autocomplete="off"
            enterkeyhint="search"
            maxlength="100"
          />
          <!-- A palette nobody knows about is a palette nobody uses. A real
             button rather than a decorative chip, so it's reachable by keyboard
             and announced like the control it is. main.js relabels it away from
             a Mac; it's hidden on touch, where there is no such key. -->
          <button
            type="button"
            class="search__hint"
            id="palette-hint"
            aria-label="Open the command palette"
          >
            <kbd aria-hidden="true">⌘K</kbd>
          </button>
        </form>

        <div class="account" id="account"><!-- rendered by main.js --></div>
      </div>

      <!-- Scroll progress, and the only scroll indicator this app has — the
         native scrollbar is hidden everywhere, in base.css. It lives in the
         header because what it draws on is the header's bottom edge, and
         nothing but the header knows where that is once a notch has moved it.
         CSS alone decides how far along it is, and a page that does not
         scroll leaves it zero pixels wide without being told to — see
         .progress in chrome.css. -->
      <span class="progress" aria-hidden="true"></span>
    </header>

    <main id="view" tabindex="-1"><!-- rendered by the router --></main>

    <div
      id="toasts"
      class="toasts"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <template id="tpl-skeleton-card">
      <article class="card card--skeleton" aria-hidden="true">
        <div class="card__rail">
          <span class="sk sk--caret"></span><span class="sk sk--count"></span>
        </div>
        <div class="card__body">
          <span class="sk sk--title"></span>
          <span class="sk sk--line"></span>
          <span class="sk sk--line sk--short"></span>
          <span class="sk sk--meta"></span>
        </div>
      </article>
    </template>
  </body>
</html>
