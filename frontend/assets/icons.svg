<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Icon sprite. Referenced with <use href="./assets/icons.svg#i-NAME"/>.
    Line icons on a 20x20 grid, 1.6 stroke, currentColor. Keep additions in this
    style. The brand keyhole and the search glass live inline in index.html; the
    vote caret is inline in ui.js because its fill is toggled by CSS.
  -->
  <symbol id="i-pencil" viewBox="0 0 20 20" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M13.4 3.6 L16.4 6.6 L7 16 L3.6 16.4 L4 12.9 Z" />
    <path d="M12 5 L15 8" />
  </symbol>

  <symbol id="i-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round">
    <circle cx="10" cy="10" r="3.6" />
    <path d="M10 2v2 M10 16v2 M2 10h2 M16 10h2 M4 4l1.5 1.5 M14.5 14.5 16 16 M16 4l-1.5 1.5 M5.5 14.5 4 16" />
  </symbol>

  <symbol id="i-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linejoin="round">
    <path d="M16 11.7 A6.4 6.4 0 1 1 8.3 4 A5 5 0 0 0 16 11.7 Z" />
  </symbol>

  <symbol id="i-chevron-left" viewBox="0 0 20 20" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4 L6 10 L12 16" />
  </symbol>

  <symbol id="i-sign-out" viewBox="0 0 20 20" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 3.5 H16 A0.5 0.5 0 0 1 16.5 4 V16 A0.5 0.5 0 0 1 16 16.5 H12.5" />
    <path d="M9 6.5 L5.5 10 L9 13.5" />
    <path d="M5.5 10 H13" />
  </symbol>

  <symbol id="i-eye" viewBox="0 0 20 20" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linejoin="round">
    <path d="M1 10 C3 5 6.5 3 10 3 C13.5 3 17 5 19 10 C17 15 13.5 17 10 17 C6.5 17 3 15 1 10 Z" />
    <circle cx="10" cy="10" r="3" />
  </symbol>

  <!-- The shelf. Two symbols rather than one whose fill CSS toggles: a <use>
       reference is a shadow tree, and `fill` set on the symbol wins over
       anything reachable from outside it. The theme toggle already swaps sun
       for moon the same way. -->
  <symbol id="i-bookmark" viewBox="0 0 20 20" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M5.7 3.6 H14.3 V16.4 L10 13 L5.7 16.4 Z" />
  </symbol>

  <symbol id="i-bookmark-filled" viewBox="0 0 20 20" fill="currentColor"
          stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"
          stroke-linecap="round">
    <path d="M5.7 3.6 H14.3 V16.4 L10 13 L5.7 16.4 Z" />
  </symbol>
</svg>
