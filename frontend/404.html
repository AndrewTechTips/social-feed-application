<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commons</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages serves this for any path it doesn't have a file for.
      //
      // This app is hash-routed (see docs/adr/0002-hash-routing.md), so a deep
      // link inside it — #/posts/12 — never reaches the server and never lands
      // here. What does land here is somebody typing or pasting a *real* path:
      // /posts/12, or a link written by hand against a History-API app. Rather
      // than showing them GitHub's 404, translate the path into the fragment the
      // router understands and send them on.
      //
      // The repository name is the first path segment on a project Pages site
      // (/social-feed-application/posts/12), and is not part of the route. It's
      // taken from the script's own URL rather than hard-coded, so this keeps
      // working at a custom domain or under a different repo name.
      (function () {
        var base = location.pathname.slice(0, location.pathname.indexOf("/", 1) + 1);
        // Serving from the domain root: nothing to strip.
        if (base === "/404.html" || base === "") base = "/";
        var route = location.pathname.slice(base.length).replace(/^\/+/, "");
        var target =
          base + (route ? "#/" + route : "") + location.search + location.hash;
        // replace(), not assign(): the bad URL should not be a back-button stop.
        location.replace(target);
      })();
    </script>
    <!-- Deliberately small. This file is fetched for every path the host
       doesn't have, and the script above usually redirects out of it before a
       single pixel is painted — so everything below is for the one reader who
       has JavaScript off, and is not worth a stylesheet, a font or an icon.
       The values are the dark theme's, copied rather than imported for the
       same reason: one file, no requests.

       The app's own 404 is js/views/notfound.js and looks nothing like this,
       because it can afford to. This is the same sentence in the same voice,
       at a hundredth of the weight. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0c1315;
        color: #93a3a1;
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 34em;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        color: #e7edec;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: 1.6rem;
        font-weight: 500;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 12px 20px;
        border-radius: 10px;
        background: #f0a63c;
        color: #2a1c05;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- Only ever seen with JavaScript off, which is also the only case where
       the app itself wouldn't work either — so this says where to go rather
       than promising to take them there. -->
    <main>
      <h1>There's nothing down this path.</h1>
      <p>
        You've landed on an address Commons doesn't have. Nothing is broken — the way in
        is still open.
      </p>
      <a href="./">Take me to Commons</a>
    </main>
  </body>
</html>
